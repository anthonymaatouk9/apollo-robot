{% extends "base.html" %}
{% block title %}Logs{% endblock %}
{% block content %}

<div class="page-header">
  <h1>Dispense logs</h1>
  <span style="font-size:13px;color:var(--text-muted)">Last 100 operations</span>
</div>

<div class="card" style="padding:0;overflow:hidden">
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Action</th>
        <th>Mission</th>
        <th>Patient</th>
        <th>Tube</th>
        <th>Result</th>
        <th>Detail</th>
      </tr>
    </thead>
    <tbody id="log-tbody">
      <tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:30px">Loading...</td></tr>
    </tbody>
  </table>
</div>

{% endblock %}
{% block scripts %}
<script>
async function load() {
  const logs = await api('GET','/logs/');
  document.getElementById('log-tbody').innerHTML = logs.length ? logs.map(l=>`
    <tr>
      <td style="font-size:12px;color:var(--text-muted);white-space:nowrap">${new Date(l.created_at).toLocaleString('en-LB')}</td>
      <td style="font-size:12px">${l.action}</td>
      <td style="font-size:12px;color:var(--text-muted)">${l.mission_id?'#'+l.mission_id:'—'}</td>
      <td style="font-size:12px;color:var(--text-muted)">${l.patient_id?'#'+l.patient_id:'—'}</td>
      <td style="font-size:12px;color:var(--text-muted)">${l.tube_id?'Tube '+l.tube_id:'—'}</td>
      <td><span class="badge badge-${l.success?'teal':'red'}">${l.success?'Success':'Failed'}</span></td>
      <td style="font-size:12px;color:var(--text-muted)">${l.detail||'—'}</td>
    </tr>`).join('') : '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:30px">No logs yet</td></tr>';
}
load(); setInterval(load,5000);
</script>
{% endblock %}
